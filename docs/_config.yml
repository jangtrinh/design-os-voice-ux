# GitHub Pages site for design-os-voice-ux, built from this docs/ folder.
# _layouts/default.html wraps every Markdown page in the landing's design language;
# index.html is a hand-built page (layout: null) sharing assets/site.css.
# jekyll-seo-tag emits <title>, <meta name="description">, Open Graph and JSON-LD;
# jekyll-sitemap emits sitemap.xml for Google Search Console.
title: design-os-voice-ux
description: Open-source Voice UX & AI Agent Architecture reference: full-duplex barge-in FSMs, sub-500ms latency budgets, tool-call filler choreography, and 6-dimension audit rubric.
url: https://jangtrinh.github.io
baseurl: /design-os-voice-ux
lang: en
repository: jangtrinh/design-os-voice-ux
repository_url: https://github.com/jangtrinh/design-os-voice-ux
wordmark: DESIGN:OS
wordmark_url: https://jangtrinh.github.io/design-os/
eyebrow: DESIGN:OS · Voice AI          # short product family label, e.g. design:os
logo: /images/cover.png          # a real capture under docs/images/
nav:                        # one entry per Markdown page under docs/, in reading order
  - { title: Deep dive, url: /deep-dive.html }
footer:
  - { title: GitHub, url: https://github.com/jangtrinh/design-os-voice-ux }
  - { title: MIT, url: https://github.com/jangtrinh/design-os-voice-ux/blob/main/LICENSE }
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
defaults:
  - scope: { path: "" }
    values: { layout: default }
  - scope: { path: "google*.html" }
    values: { sitemap: false }
