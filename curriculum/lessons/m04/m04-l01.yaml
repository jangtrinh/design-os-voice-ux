schema_version: "1.0"

lesson:
  id: m04-l01
  module_id: m04
  title: "Earcons, Haptics & Acoustic States"
  track: pro
  estimated_minutes: 10
  objectives:
    - id: obj-earcon-design
      verb: identify
      concept: "Non-speech auditory icons and earcon semiotics (listening start, processing, success, error)"
    - id: obj-audio-ducking
      verb: apply
      concept: "Audio Session ducking and multichannel volume attenuation (Apple HIG / Android Audio Focus)"

slides:
  # L1 — Hook
  - id: l1
    phase: learn
    stage: hook
    objective_ids: [obj-earcon-design]
    content:
      headline: "The Silence of Uncertainty"
      body: "You say 'Hey Siri' or press a mic button. If there is 0ms feedback, you hesitate and wonder: 'Is it listening to me?'"
      takeaway: "An instant earcon (<50ms) confirms acoustic capture before speech recognition even begins."
    visual:
      widget: earcon-synthesizer
      version: 1
      props:
        states: [listening_start, listening_stop, processing_loop, success_chime, error_thud]
        active_state: listening_start
    interaction:
      type: play-sample
      required: true
    completion:
      event: earcon_played
      minimum_interactions: 1

  # L2 — Model
  - id: l2
    phase: learn
    stage: model
    objective_ids: [obj-earcon-design]
    content:
      headline: "The Acoustic State Machine"
      body: "Earcons map directly to internal state transitions: Rising pitch = Open/Accept. Falling pitch = Close/Reject."
      takeaway: "Musical semiotics: major thirds convey completion; minor intervals or low dissonant thuds convey failure."
    visual:
      widget: earcon-synthesizer
      version: 1
      props:
        pitch_contours:
          - { state: "start", notes: ["C4", "G4"], interval: "ascending_fifth" }
          - { state: "complete", notes: ["G4", "C5"], interval: "ascending_fourth" }
          - { state: "error", notes: ["Eb4", "Bb3"], interval: "descending_fourth" }
    interaction:
      type: compare-triad
      required: true
    completion:
      event: all_states_inspected
      minimum_interactions: 3

  # L3 — Practice
  - id: l3
    phase: learn
    stage: practice
    objective_ids: [obj-audio-ducking]
    content:
      headline: "Tuning Audio Ducking Depth"
      body: "When an assistant speaks while background music is playing, duck the music volume by -12dB to -18dB."
      takeaway: "Never pause music completely for brief feedback; duck smoothly with a 150ms crossfade."
    visual:
      widget: waveform-endpointing
      version: 1
      props:
        music_channel_db: 0
        voice_channel_db: 0
        ducking_depth_db: -15
        interactive_slider: true
    interaction:
      type: drag-threshold
      required: true
    completion:
      event: parameter_tuned
      minimum_interactions: 1

  # L4 — Transfer
  - id: l4
    phase: learn
    stage: transfer
    objective_ids: [obj-earcon-design]
    content:
      headline: "The Sensory Triad: Earcon + Haptic + Visual"
      body: "For deaf or hard-of-hearing users, or users in noisy subway cars, an earcon alone fails."
      takeaway: "Synchronize the earcon chime with a subtle haptic tap (transient motor click) and screen pulse."
    visual:
      widget: earcon-synthesizer
      version: 1
      props:
        triad_mode: true
        channels: [audio_chime, haptic_pulse, visual_halo]
        latency_alignment_ms: 0
    interaction:
      type: inspect-region
      required: true
    completion:
      event: edge_case_explored
      minimum_interactions: 1

  # T1 — Recognize
  - id: t1
    phase: test
    stage: recognize
    objective_ids: [obj-earcon-design]
    prompt: "In auditory interface design, what musical pitch motion is intuitively recognized by users as an affirmative 'Task Succeeded' cue?"
    visual:
      widget: earcon-synthesizer
      version: 1
      props:
        audio_options: ["ascending_major", "descending_minor", "monotone_drone", "white_noise_burst"]
    assessment:
      type: single_choice
      answer: "ascending_major_pitch"
      scoring:
        max_points: 1
      hints:
        - id: h1
          tier: 1
          trigger: { after_attempts: 1 }
          text: "Think of Apple Pay or Nintendo positive feedback chimes."
          penalty: 0.1
        - id: h2
          tier: 2
          trigger: { after_attempts: 2 }
          text: "Ascending major intervals convey resolution and achievement."
          penalty: 0.25
      explanation: "Ascending harmonic intervals (e.g. C to G or major triads) universalize positive completion across cultures."

  # T2 — Apply
  - id: t2
    phase: test
    stage: apply
    objective_ids: [obj-audio-ducking]
    prompt: "Configure the Apple iOS Audio Session category and options for an in-app voice assistant that allows background podcast playback to continue at reduced volume."
    visual:
      widget: pipeline-repair-board
      version: 1
      props:
        audio_session_config: true
    assessment:
      type: single_choice
      answer: "play_and_record_with_duck_others"
      scoring:
        max_points: 1
      hints:
        - id: h1
          tier: 1
          trigger: { after_attempts: 1 }
          text: "You need both mic recording and audio playback with ducking enabled."
          penalty: 0.1
        - id: h2
          tier: 2
          trigger: { after_attempts: 2 }
          text: "Category: `AVAudioSessionCategoryPlayAndRecord`, Option: `.duckOthers`."
          penalty: 0.25
      explanation: "`AVAudioSessionCategoryPlayAndRecord` combined with `.duckOthers` automatically ducks ambient media by ~15dB without stopping playback."

  # T3 — Diagnose
  - id: t3
    phase: test
    stage: diagnose
    objective_ids: [obj-audio-ducking]
    prompt: "Users complain that whenever the assistant speaks, their car stereo sound cuts out violently with an ugly silence gap, then blasts loudly. What bug caused this?"
    visual:
      widget: waveform-endpointing
      version: 1
      props:
        abrupt_cut_graph: true
    assessment:
      type: single_choice
      answer: "exclusive_interruption_without_ramp"
      scoring:
        max_points: 1
      hints:
        - id: h1
          tier: 1
          trigger: { after_attempts: 1 }
          text: "The app took exclusive audio focus without applying crossfade ramp times."
          penalty: 0.1
      explanation: "Taking exclusive audio focus without a ducking crossfade forces the media player into hard pause/resume cycles."

  # T4 — Production Decision
  - id: t4
    phase: test
    stage: production_decision
    objective_ids: [obj-earcon-design, obj-audio-ducking]
    prompt: "You are designing earcon cues for a wearable fitness coach during outdoor sprint workouts. Ambient wind noise is high. What is the production architecture decision?"
    visual:
      widget: earcon-synthesizer
      version: 1
      props:
        outdoor_wind_noise: true
        tactile_priority: true
    assessment:
      type: single_choice
      answer: "haptic_primary_with_high_frequency_harmonic_earcon"
      scoring:
        max_points: 1
      hints:
        - id: h1
          tier: 1
          trigger: { after_attempts: 1 }
          text: "Wind noise drowns out low and mid audio frequencies."
          penalty: 0.1
        - id: h2
          tier: 2
          trigger: { after_attempts: 2 }
          text: "Deliver a strong haptic tap paired with a crisp 2.5kHz-4kHz harmonic chime."
          penalty: 0.25
      explanation: "Outdoor noise masks bass/mid frequencies. High-frequency piercing earcons combined with haptic vibrations guarantee reliable perception."

player_state_machine:
  initial: idle
  states:
    idle: {}
    active: {}
    evaluating: {}
    feedback_correct: {}
    feedback_incorrect: {}
    completed: {}
  transitions:
    - { from: idle, event: START, to: active }
    - { from: active, event: SUBMIT, to: evaluating }
    - { from: evaluating, event: PASS, to: feedback_correct }
    - { from: evaluating, event: FAIL, to: feedback_incorrect }
    - { from: feedback_correct, event: CONTINUE, to: completed }

telemetry:
  context:
    lesson_id: m04-l01
    schema_version: 1
  capture:
    - lesson_started
    - slide_viewed
    - widget_interacted
    - answer_submitted
    - hint_requested
    - answer_correct
    - answer_incorrect
    - lesson_completed

pass_criteria:
  tests:
    required: [t1, t2, t3, t4]
  score:
    minimum_ratio: 0.8
  production_decision:
    slide: t4
    required: true
    minimum_score: 1
